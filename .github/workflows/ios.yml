name: iOS TestFlight

# main'e her push'ta ve elle (Actions sekmesi -> Run workflow) çalışır.
# App Store Connect anahtarları GitHub Secrets'ta yoksa imzasız derler.
# Anahtarlar varsa paket kimliğini (com.cankyra.stainedglass) kaydeder, imzalar ve TestFlight'a yükler.
#
# Gerekli secrets (Settings -> Secrets and variables -> Actions):
#   APPLE_TEAM_ID       Apple Developer Team ID (10 karakter)
#   ASC_KEY_ID          App Store Connect API anahtar kimliği
#   ASC_ISSUER_ID       App Store Connect API Issuer ID
#   ASC_KEY_P8          İndirilen AuthKey_XXXX.p8 dosyasının içeriği (tamamı)

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 26 seç
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X/Contents/Developer"; fi
          xcodebuild -version

      - name: Xcode projesini hazırla
        run: |
          which xcodegen >/dev/null 2>&1 || brew install xcodegen
          mkdir -p ios/Web
          cp index.html style.css generator.js game.js icon.svg manifest.webmanifest ios/Web/
          sed -i '' "s/CURRENT_PROJECT_VERSION: .*/CURRENT_PROJECT_VERSION: \"${GITHUB_RUN_NUMBER}\"/" ios/project.yml
          (cd ios && xcodegen generate)

      - name: Anahtarlar tanımlı mı
        id: keys
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: echo "has=$([ -n "$KEY_ID" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      - name: İmzasız derleme (anahtar yok)
        if: steps.keys.outputs.has == 'no'
        run: |
          set -o pipefail
          xcodebuild -project ios/StainedGlass.xcodeproj -scheme StainedGlass -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build | tail -30
          echo "::notice::İmzasız derleme başarılı. TestFlight'a yükleme için App Store Connect anahtarlarını GitHub Secrets'a ekleyin."

      - name: İmzala ve TestFlight'a yükle
        if: steps.keys.outputs.has == 'yes'
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          BUNDLE_ID: com.cankyra.stainedglass
        run: |
          set -eo pipefail
          W="$RUNNER_TEMP/sign"
          mkdir -p "$W"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyjwt cryptography
          PY="$RUNNER_TEMP/venv/bin/python"

          openssl genrsa -out "$W/dist.key" 2048 2>/dev/null
          openssl req -new -key "$W/dist.key" -out "$W/dist.csr" -subj "/CN=StainedGlass CI/O=StainedGlass/C=TR"
          "$PY" tools/asc_setup.py signing "$W/dist.csr" "$W"
          source "$W/ids.env"
          openssl x509 -inform DER -in "$W/dist.cer" -out "$W/dist.pem"
          P12PASS=$(openssl rand -hex 12)
          openssl pkcs12 -export -legacy -inkey "$W/dist.key" -in "$W/dist.pem" -out "$W/dist.p12" -passout "pass:$P12PASS" 2>/dev/null \
            || openssl pkcs12 -export -inkey "$W/dist.key" -in "$W/dist.pem" -out "$W/dist.p12" -passout "pass:$P12PASS"
          KC="$RUNNER_TEMP/sign.keychain-db"
          KCPASS=$(openssl rand -hex 12)
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          security import "$W/dist.p12" -k "$KC" -P "$P12PASS" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"
            cp "$W/profile.mobileprovision" "$d/$PROFILE_UUID.mobileprovision"
          done

          xcodebuild -project ios/StainedGlass.xcodeproj -scheme StainedGlass -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/StainedGlass.xcarchive archive \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM" \
            CODE_SIGN_IDENTITY="Apple Distribution" PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" | tail -25

          KEY="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          AUTH=(-authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string></dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/StainedGlass.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/export "${AUTH[@]}" | tail -25
          echo "::notice::Derleme ${GITHUB_RUN_NUMBER} TestFlight'a yüklendi. App Store Connect'te işlenmesi 10-30 dakika sürer."

      - name: Geçici sertifikayı ve profili sil
        if: always() && steps.keys.outputs.has == 'yes'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          [ -x "$RUNNER_TEMP/venv/bin/python" ] && "$RUNNER_TEMP/venv/bin/python" tools/asc_setup.py cleanup "$RUNNER_TEMP/sign/ids.env" || true
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8
          rm -rf "$RUNNER_TEMP/sign"
          security delete-keychain "$RUNNER_TEMP/sign.keychain-db" 2>/dev/null || true
